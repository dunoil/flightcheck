[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flightcheck-qnx"
version = "0.1.0"
description = "FlightCheck for QNX: doctor, scaffold, and lint QNX 8.0 projects from the host."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
flightcheck = "flightcheck.cli:main"

[tool.setuptools]
packages = ["flightcheck"]
